services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uniagent
      POSTGRES_PASSWORD: uniagent
      POSTGRES_DB: uniagent
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
